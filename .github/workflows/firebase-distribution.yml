name: Firebase App Distribution

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor (dev/staging/prod)'
        required: false
        default: 'dev'

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'

jobs:
  build-and-distribute:
    name: Build & Distribute (${{ github.ref_name }})
    runs-on: [self-hosted, linux]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --flavor=${{ github.event.inputs.flavor || 'dev' }}

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appFile: build/app/outputs/flutter-apk/app-${{ github.event.inputs.flavor || 'dev' }}-debug.apk
          groups: ${{ github.ref_name == 'main' && 'production' || 'testers' }}
          release-notes: |
            Build: ${{ github.run_number }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.ref_name }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-${{ github.event.inputs.flavor || 'dev' }}-debug.apk
          retention-days: 7
