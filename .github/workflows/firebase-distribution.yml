name: Deploy to Server OTA

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor (dev/staging/prod)'
        required: false
        default: 'dev'
      version:
        description: 'Version (e.g. 1.0.0)'
        required: false
        default: ''

env:
  FLUTTER_VERSION: '3.27.0'
  JAVA_VERSION: '17'

jobs:
  build-and-deploy:
    name: Build & Deploy OTA (${{ github.ref_name }})
    runs-on: [self-hosted, linux]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Get dependencies
        run: flutter pub get

      - name: Get current version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Extract version from pubspec.yaml
            VERSION=$(grep "^version:" pubspec.yaml | head -1 | awk '{print $2}' | tr -d '+0-9')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "APK_PATH=build/app/outputs/flutter-apk/app-${{ github.event.inputs.flavor || 'dev' }}-debug.apk" >> $GITHUB_OUTPUT
          echo "FILENAME=rgb-app-v${VERSION}.apk" >> $GITHUB_OUTPUT

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --flavor=${{ github.event.inputs.flavor || 'dev' }}

      - name: Upload to Server via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "${{ steps.version.outputs.APK_PATH }}"
          target: "/var/www/backend-production/storage/app/public/apk"
          target_filename: "${{ steps.version.outputs.FILENAME }}"
          overwrite: true
          strip_components: 0

      - name: Set file permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            chown www-data:www-data /var/www/backend-production/storage/app/public/apk/${{ steps.version.outputs.FILENAME }}
            chmod 644 /var/www/backend-production/storage/app/public/apk/${{ steps.version.outputs.FILENAME }}
            echo "APK deployed successfully!"
            ls -la /var/www/backend-production/storage/app/public/apk/

      - name: Create version file
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo '{
              "version": "${{ steps.version.outputs.VERSION }}",
              "version_code": 1,
              "apk_url": "https://api-admin-erp.rgb86groups.com/apk/${{ steps.version.outputs.FILENAME }}",
              "filename": "${{ steps.version.outputs.FILENAME }}",
              "force_update": true,
              "min_version": null,
              "build": ${{ github.run_number }},
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "released_at": "'$(date -u +'%Y-%m-%dT%H:%M:%SZ')'"
            }' > /tmp/latest-version.json
            cp /tmp/latest-version.json /var/www/backend-production/public/apk/latest.json
            chown www-data:www-data /var/www/backend-production/public/apk/latest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.VERSION }}-${{ github.run_number }}
          path: "${{ steps.version.outputs.APK_PATH }}"
          retention-days: 7

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Filename:** ${{ steps.version.outputs.FILENAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK URL:** https://api-admin-erp.rgb86groups.com/apk/${{ steps.version.outputs.FILENAME }}" >> $GITHUB_STEP_SUMMARY
